<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATEC — send me a message</title>
<style>
  :root {
    --bg: #080b0a;
    --panel: #111814;
    --line: #213026;
    --leaf: #8fdc6a;
    --copper: #e39a5a;
    --space: #6ab8ff;
    --text: #e3eadf;
    --dim: #93a597;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #1d3a2a88 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 31px, #ffffff06 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, #ffffff06 31px 32px),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px; }

  header { text-align: center; padding: 72px 0 40px; }
  .logo { font-size: 64px; display: block; margin-bottom: 8px;
          filter: drop-shadow(0 0 18px #8fdc6a88); }
  h1 {
    font-family: "Menlo", "Consolas", monospace;
    font-size: clamp(30px, 7vw, 56px);
    letter-spacing: 2px;
    color: var(--leaf);
    text-shadow: 0 0 24px #8fdc6a55;
  }
  .badge {
    display: inline-block; margin-top: 10px; padding: 2px 12px;
    font-family: "Menlo", "Consolas", monospace; font-size: 13px;
    color: var(--copper); border: 1px solid var(--copper); border-radius: 999px;
  }
  .longname {
    font-family: "Menlo", "Consolas", monospace; font-size: 12px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--dim); margin-bottom: 6px;
  }
  .say { color: var(--dim); font-size: 13px; margin-top: 2px; font-family: "Menlo", "Consolas", monospace; }
  .tagline { color: var(--space); font-size: clamp(16px, 3vw, 20px); margin-top: 12px; }
  .story { color: var(--dim); max-width: 560px; margin: 18px auto 0; }

  /* the version selection bar */
  .picker {
    margin: 36px auto 0; max-width: 560px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px;
  }
  .picker label { font-family: "Menlo", "Consolas", monospace; color: var(--dim); font-size: 14px; }
  .picker select {
    font-family: "Menlo", "Consolas", monospace; font-size: 15px;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    min-width: 220px; max-width: 100%;
  }
  .picker select:focus { outline: 2px solid var(--leaf); outline-offset: 1px; }
  .notes { width: 100%; color: var(--dim); font-size: 14px; }
  .next { width: 100%; font-size: 13px; color: var(--space); font-family: "Menlo", "Consolas", monospace; }
  .yt { display: inline-block; margin-top: 10px; padding: 8px 16px; border-radius: 8px; background: #ff0033; color: #fff; font-weight: 700; text-decoration: none; font-size: 15px; }
  .yt:hover { filter: brightness(1.12); }
  .count { margin: 14px 0 0; font-size: 13px; color: var(--dim); font-family: "Menlo", "Consolas", monospace; min-height: 1em; }

  .download {
    display: inline-block;
    margin-top: 24px;
    padding: 18px 44px;
    font-size: 22px;
    font-weight: 700;
    font-family: "Menlo", "Consolas", monospace;
    color: #0b1a0c;
    background: linear-gradient(180deg, var(--leaf), #5fb744);
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 0 32px #8fdc6a55, 0 4px 0 #2f6b22;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .download:hover { transform: translateY(-2px); box-shadow: 0 0 46px #8fdc6a88, 0 6px 0 #2f6b22; }
  .download small { display: block; font-size: 13px; font-weight: 400; margin-top: 2px; }
  .download.win {
    background: linear-gradient(180deg, var(--space), #3a86c9);
    box-shadow: 0 0 32px #6ab8ff55, 0 4px 0 #1f4f7a;
    margin-left: 14px;
  }
  .download.win:hover { box-shadow: 0 0 46px #6ab8ff88, 0 6px 0 #1f4f7a; }
  /* the browser version (play/, a Godot Web export in Compatibility mode) */
  .playrow { margin-top: 4px; }
  .download.play {
    background: linear-gradient(180deg, var(--copper), #b8693a);
    box-shadow: 0 0 32px #e39a5a55, 0 4px 0 #6e3a1c;
    margin-top: 18px;
  }
  .download.play:hover { box-shadow: 0 0 46px #e39a5a88, 0 6px 0 #6e3a1c; }
  /* the phone version (mobile/, Beta 1.6 recovered from play/ with touch controls added) */
  .download.mobile {
    background: linear-gradient(180deg, #b892ff, #7c55d6);
    box-shadow: 0 0 32px #b892ff55, 0 4px 0 #46297e;
    margin-top: 18px;
    margin-left: 14px;
  }
  .download.mobile:hover { box-shadow: 0 0 46px #b892ff88, 0 6px 0 #46297e; }
  @media (max-width: 560px) {
    .download { display: block; margin-left: 0 !important; }
  }

  .guide {
    margin: 22px auto 0; max-width: 560px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 18px;
    color: var(--dim); font-size: 14px; text-align: left;
  }
  .guide h3 { color: var(--copper); font-size: 15px; margin-bottom: 6px; }
  .guide ol { padding-left: 20px; }
  .guide li { margin: 3px 0; }
  .guide b { color: var(--text); }
  .guide + .guide { margin-top: 12px; }

  section { margin: 56px 0; }
  h2 {
    font-family: "Menlo", "Consolas", monospace;
    color: var(--space); font-size: 24px; margin-bottom: 18px;
    text-shadow: 0 0 16px #6ab8ff44;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px;
  }
  .card h3 { font-size: 16px; color: var(--leaf); margin-bottom: 6px; }
  .card p { font-size: 14px; color: var(--dim); }

  .msg { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .msg p { color: var(--dim); font-size: 14px; margin-bottom: 12px; }
  .msg input, .msg textarea {
    width: 100%; margin-bottom: 10px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 15px;
  }
  .msg textarea { min-height: 120px; resize: vertical; }
  .msg button {
    padding: 10px 22px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 700;
    background: var(--leaf); color: #10200a;
  }
  .msg button:disabled { opacity: .5; cursor: default; }
  .msg .gotcha { position: absolute; left: -9999px; }
  #msg-status { margin: 10px 0 0; min-height: 1em; }

  .ages { list-style: none; }
  .ages li {
    padding: 10px 16px; margin-bottom: 8px;
    background: var(--panel); border-left: 3px solid var(--copper);
    border-radius: 0 10px 10px 0; font-size: 15px;
  }
  .ages li.next { border-left-color: var(--space); opacity: .75; }
  .ages b { font-family: "Menlo", monospace; color: var(--text); }
  .ages span { color: var(--dim); }

  .keys { width: 100%; border-collapse: collapse; font-size: 14px; }
  .keys td { padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .keys td:first-child { font-family: "Menlo", monospace; color: var(--copper); white-space: nowrap; width: 1%; }
  .keys td:last-child { color: var(--dim); }

  footer {
    text-align: center; padding: 40px 0 60px;
    color: var(--dim); font-size: 14px;
    border-top: 1px solid var(--line); margin-top: 60px;
  }
  footer a { color: var(--space); }
  .topbar { display: flex; justify-content: flex-start; }
  .msglink {
    display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 13px;
    font-family: "Menlo", "Consolas", monospace; text-decoration: none;
    color: var(--leaf); border: 1px solid var(--leaf); background: #8fdc6a14;
  }
  .msglink:hover { background: #8fdc6a33; }
  header.small { padding: 40px 0 24px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar back"><a class="msglink" href="../">← Back to ATEC</a></div>

  <header class="small">
    <span class="logo">🌲</span>
    <h1>ATEC</h1>
    <p class="tagline">Send me a message</p>
  </header>

  <section id="message">
    <form class="msg" id="msg-form">
      <p>Played ATEC? Tell me what you liked, where you got stuck, or what I should add next. I read every message!</p>
      <input name="name" maxlength="60" placeholder="Your name or nickname (optional)">
      <textarea name="message" maxlength="2000" required placeholder="Your message"></textarea>
      <input class="gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
      <button type="submit">Send</button>
      <p id="msg-status"></p>
    </form>
  </section>

  <footer>
    Made with <a href="https://godotengine.org">Godot 4.7</a> by Viyan ·
    <a href="https://github.com/viyanajith/ATEC">ATEC on GitHub</a> ·
    <a href="https://www.youtube.com/@viyanajith">YouTube</a>
  </footer>

</div>
<script>
  // Messages (Formspree): the form sends to Formspree, which emails them on. Only this ID is in
  // the code, never the email address.
  const FORM_ID = "xkjroybv";
  const form = document.getElementById("msg-form");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const status = document.getElementById("msg-status");
    const button = form.querySelector("button");
    button.disabled = true;
    status.textContent = "Sending...";
    try {
      const r = await fetch(`https://formspree.io/f/${FORM_ID}`, {
        method: "POST", body: new FormData(form), headers: { Accept: "application/json" },
      });
      if (!r.ok) throw new Error();
      form.reset();
      status.textContent = "Thanks! Your message was sent. 🚀";
    } catch (e) {
      status.textContent = "Sorry, it didn't send. Try again in a minute.";
    }
    button.disabled = false;
  });
</script>
</body>
</html>
